/* =========================================================
   RANDOM ID
========================================================= */

function generateRandomId(length = 32) {

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (let i = 0; i < length; i++) {

    result += chars.charAt(
      Math.floor(
        Math.random() * chars.length
      )
    );

  }

  return result;

}

}

/* =========================================================
   DEVICE LOCAL LOCK
========================================================= */

function isDeviceLockedToOtherAccount(uid) {

  const boundUid =
    localStorage.getItem(
      DEVICE_LOCK_KEY
    );

  return (
    !!boundUid &&
    boundUid !== uid
  );

}


function lockDeviceToAccount(uid) {

  if (!uid) return false;

  const boundUid =
    localStorage.getItem(
      DEVICE_LOCK_KEY
    );

  if (!boundUid) {

    localStorage.setItem(
      DEVICE_LOCK_KEY,
      uid
    );

    return true;

  }

  return boundUid === uid;

}


/* =========================================================
   FIRESTORE DEVICE BINDING
========================================================= */

async function getFirestoreDeviceBinding() {

  if (
    !db ||
    !deviceInstallationId

  }

  try {

    const deviceRef =
      doc(
        db,
        "deviceBindings",
        deviceInstallationId
      );

    const snap =
      await getDoc(deviceRef);

    if (snap.exists()) {

      return snap.data();

    }

  } catch (error) {

    /*
      IMPORTANT:
      Permission error হলে login বন্ধ হবে না।
    */

    console.warn(
      "Firestore device binding unavailable:",
      error?.code || error
    );

  }

  return null;

}


/* =========================================================
   RTDB DEVICE BINDING
========================================================= */

async function getRealtimeDeviceBinding() {

    !rtdb ||

  try {

    const deviceRef =
      ref(
        rtdb,
        "deviceBindings/" +

      await get(deviceRef);

    if (snap.exists()) {

    console.warn(
      "RTDB device binding unavailable:",
      error?.code || error
    );

  }

  return null;

}


/* =========================================================
   CHECK DEVICE BINDING
========================================================= */

async function checkDeviceBinding(uid) {

  if (!uid) {

    return {
      allowed: false,
      reason: "INVALID_UID"
    };

  }


  /*
    Local lock is fast and reliable.
  */

  if (
    isDeviceLockedToOtherAccount(
      uid
    )
  ) {

    return {
      allowed: false,
      reason: "LOCAL_OTHER_ACCOUNT"
    };

  }


  /*
    Server binding is now OPTIONAL.
    Permission failure will NOT block login.
  */

  const results =
    await Promise.allSettled([

      getFirestoreDeviceBinding(),

      getRealtimeDeviceBinding()

    ]);


  const firestoreBinding =
    results[0].status === "fulfilled"
      ? results[0].value
      : null;


  const realtimeBinding =
    results[1].status === "fulfilled"
      ? results[1].value
      : null;


  const firestoreUid =
    firestoreBinding?.uid || "";


  const realtimeUid =
    realtimeBinding?.uid || "";


  if (
    firestoreUid &&
    firestoreUid !== uid
  ) {

    return {
      allowed: false,
      reason: "FIRESTORE_OTHER_ACCOUNT",
      boundUid: firestoreUid
    };

  }


  if (
    realtimeUid &&
    realtimeUid !== uid
  ) {

    return {
      allowed: false,
      reason: "RTDB_OTHER_ACCOUNT",
      boundUid: realtimeUid
    };

  }


  return {
    allowed: true,
    reason: "OK"
  };

}


/* =========================================================
   CREATE DEVICE BINDING
========================================================= */

async function bindDeviceToAccount(
  uid,
  profile
) {

  if (
    !uid ||
    !deviceInstallationId
  ) {

    return false;

  }


  /*
    First local lock.
  */

  const localBoundUid =
    localStorage.getItem(
      DEVICE_LOCK_KEY
    );


  if (
    localBoundUid &&
    localBoundUid !== uid
  ) {

    return false;

  }


  /*
    Local lock first.
    This prevents login race.
  */

  const localLocked =
    lockDeviceToAccount(
      uid
    );


  if (!localLocked) {

    return false;

  }


  const bindingData = {

    deviceId:
      deviceInstallationId,

    uid:
      uid,

    name:
      profile?.name ||
      "ব্যবহারকারী",

    createdAtClient:
      new Date().toISOString(),

    updatedAt:
      Date.now(),

    active:
      true

  };


  /*
    Firebase binding is BEST EFFORT.

    Rules permission না থাকলেও login block হবে না।
  */

  if (db) {

    try {

      const deviceRef =
        doc(
          db,
          "deviceBindings",
          deviceInstallationId
        );

      const existing =
        await getDoc(
          deviceRef
        );


      if (
        existing.exists()
      ) {

        const existingUid =
          existing.data()?.uid || "";


        if (
          existingUid &&
          existingUid !== uid
        ) {

          /*
            Server says another account.
            Local lock rollback করা হবে।
          */

          localStorage.removeItem(
            DEVICE_LOCK_KEY
          );

          return false;

        }

      }


      await setDoc(
        deviceRef,
        bindingData,
        {
          merge: true
        }
      );

    } catch (error) {

      console.warn(
        "Firestore device binding skipped:",
        error?.code || error
      );

    }

  }


  if (rtdb) {

    try {

      const deviceRef =
        ref(
          rtdb,
          "deviceBindings/" +
          deviceInstallationId
        );


      const existing =
        await get(
          deviceRef
        );


      if (
        existing.exists()
      ) {

        const existingUid =
          existing.val()?.uid || "";


        if (
          existingUid &&
          existingUid !== uid
        ) {

          localStorage.removeItem(
            DEVICE_LOCK_KEY
          );

          return false;

        }

      }


      await set(
        deviceRef,
        bindingData
      );

    } catch (error) {

      console.warn(
        "RTDB device binding skipped:",
        error?.code || error
      );

    }

  }


  return true;

}

/* =========================================================

========================================================= */

  /*
    Firebase sync failure will NOT logout user.
  */

  await Promise.allSettled([

    saveUserToFirestore(
      profile
    ),

    saveUserToRealtimeDB(
      profile
    )

  ]);

/* =========================================================
   MERGE USER
========================================================= */

function mergeUserData(
  localData,
  firestoreData,
  rtdbData,
  firebaseUserData
) {

  const sources = [

    localData || {},

    firestoreData || {},

    rtdbData || {},

    firebaseUserData || {}

  ];


  const merged = {};


  for (
    const source of sources
  ) {

    Object.keys(
      source
    ).forEach(
      key => {

        if (
          source[key] !== undefined &&
          source[key] !== null
        ) {

          merged[key] =
            source[key];

        }

      }
    );

  }


  merged.uid =
    firebaseUserData?.uid ||
    firestoreData?.uid ||
    rtdbData?.uid ||
    localData?.uid ||
    "";


  merged.coins =
    Number(
      firestoreData?.coins ??
      rtdbData?.coins ??
      localData?.coins ??
      0
    );


  merged.totalEarned =
    Number(
      firestoreData?.totalEarned ??
      rtdbData?.totalEarned ??
      localData?.totalEarned ??
      0
    );


  merged.referralCount =
    Number(
      firestoreData?.referralCount ??
      rtdbData?.referralCount ??
      localData?.referralCount ??
      0
    );


  merged.isLoggedIn =
    true;


  merged.status =
    merged.status ||
    "active";


  return merged;

}


/* =========================================================
   REFERRAL CODE
========================================================= */

function generateReferralCode(uid) {

  if (!uid) {

    return (
      "EARN" +
      Math.random()
        .toString(36)
        .substring(2, 8)
        .toUpperCase()
    );

  }


  return (
    "EARN" +
    uid
      .substring(0, 8)
      .toUpperCase()
  );

}


/* =========================================================
   LOAD / CREATE PROFILE
========================================================= */

async function loadOrCreateFirebaseProfile(
  user
) {

  if (
    !user ||
    authProfileLoading
  ) {

    return;

  }


  authProfileLoading =
    true;


  try {

    firebaseUser =
      user;


    /*
      IMPORTANT:
      এখানে আর Firebase device binding
      failure হলে signOut করা হবে না।
    */

    const deviceCheck =
      await checkDeviceBinding(
        user.uid
      );


    if (!deviceCheck.allowed) {

      console.warn(
        "Device binding conflict:",
        deviceCheck
      );


      /*
        সত্যিই অন্য UID bind থাকলে
        logout করা যাবে।
      */

      if (
        deviceCheck.reason ===
        "LOCAL_OTHER_ACCOUNT" ||

        deviceCheck.reason ===
        "FIRESTORE_OTHER_ACCOUNT" ||

        deviceCheck.reason ===
        "RTDB_OTHER_ACCOUNT"
      ) {

        try {

          await signOut(
            auth
          );

        } catch (e) {}

        currentUserProfile =
          getLocalProfile();

        currentUserProfile.isLoggedIn =
          false;

        saveLocalProfile(
          currentUserProfile
        );

        updateDashboardUI(
          currentUserProfile
        );

        showToast(
          "এই ডিভাইসে অন্য account আগে থেকেই যুক্ত আছে!"
        );

        return;

      }

    }


    const local =
      getLocalProfile();


    const firestore =
      await loadUserFromFirestore(
        user.uid
      );


    const realtime =
      await loadUserFromRealtimeDB(
        user.uid
      );


    const firebaseBasicData = {

      uid:
        user.uid,

      name:
        user.displayName ||
        firestore?.name ||
        realtime?.name ||
        local.name ||
        "ব্যবহারকারী",

      email:
        user.email ||
        firestore?.email ||
        realtime?.email ||
        local.email ||
        "",

      photoURL:
        user.photoURL ||
        firestore?.photoURL ||
        realtime?.photoURL ||
        local.photoURL ||
        (
          "https://api.dicebear.com/7.x/bottts/svg?seed=" +
          encodeURIComponent(user.uid)
        )

    };


    currentUserProfile =
      mergeUserData(
        local,
        firestore,
        realtime,
        firebaseBasicData
      );


    if (
      !currentUserProfile.referralCode
    ) {

      currentUserProfile.referralCode =
        generateReferralCode(
          user.uid
        );

    }


    if (
      !currentUserProfile.createdAt
    ) {

      currentUserProfile.createdAt =
        new Date().toISOString();

    }


    currentUserProfile.isLoggedIn =
      true;


    /*
      Local binding first.
      Firebase binding is best-effort.
    */

    const bound =
      await bindDeviceToAccount(
        user.uid,
        currentUserProfile
      );


    if (!bound) {

      /*
        এখানে Firebase permission failure-এর
        কারণে আর signOut করা হবে না।
      */

      console.warn(
        "Device binding could not be completed."
      );

    }


    saveLocalProfile(
      currentUserProfile
    );


    updateDashboardUI(
      currentUserProfile
    );


    /*
      Background sync
    */

    syncUserToFirebase(
      currentUserProfile
    ).catch(
      console.warn
    );


    loadTransactionHistory()
      .catch(
        console.warn
      );


    closeLoginModal();


    console.log(
      "User loaded:",
      currentUserProfile
    );

  } finally {

    authProfileLoading =
      false;

  }

}


/* =========================================================
   AUTH STATE
========================================================= */

if (auth) {

  onAuthStateChanged(
    auth,
    async user => {

      console.log(
        "Auth state:",
        user
          ? user.uid
          : "signed-out"
      );


      if (user) {

        await loadOrCreateFirebaseProfile(
          user
        );

      } else {

        firebaseUser =
          null;


        /*
          যদি login process চলতে থাকে,
          তখন local profile immediately guest
          করে দেওয়া হবে না।
        */

        if (!loginInProgress) {

          currentUserProfile =
            getLocalProfile();

          currentUserProfile.isLoggedIn =
            false;

          saveLocalProfile(
            currentUserProfile
          );

          updateDashboardUI(
            currentUserProfile
          );

        }

      }

    }
  );

}

      ).toLocaleString();

    );

  }


  const headerName =
    document.getElementById(
      "header-user-name"
    );

  if (headerName) {

  }


  const profileName =
    document.getElementById(
      "profile-page-name"
    );

  if (profileName) {

    profileName.innerText =

  }

    document.getElementById(
      "profile-page-email"
    );

    profileEmail.innerText =

  const profileUID =

/* =========================================================
   PREPARE AUTH
========================================================= */

async function prepareAuth() {

  if (!auth) {

    throw new Error(
      "AUTH_NOT_INITIALIZED"
    );

  }


  if (!authPersistenceReady) {

    await setPersistence(
      auth,
      browserLocalPersistence
    );

    authPersistenceReady =
      true;

  }

}


/* =========================================================
   GOOGLE LOGIN
========================================================= */

window.handleGoogleLogin =
async function() {

  if (loginInProgress) {

    return;

  }


  if (!auth) {

    showToast(
      "Firebase চালু হয়নি!"
    );

    return;

  }


  loginInProgress =
    true;


  try {

    await prepareAuth();


    /*
      Existing user?
    */

    if (
      auth.currentUser
    ) {

      closeLoginModal();

      showToast(
        "আপনি ইতিমধ্যে লগইন আছেন!"
      );

      return;

    }


    const provider =
      new GoogleAuthProvider();


    provider.setCustomParameters({
      prompt: "select_account"
    });


    const result =
      await signInWithPopup(
        auth,
        provider
      );


    if (
      result &&
      result.user
    ) {

      firebaseUser =
        result.user;


      /*
        Auth state observer will load profile.
      */

      closeLoginModal();


      showToast(
        "Google login সফল হয়েছে!"
      );

    }

  } catch (error) {

    console.error(
      "Google login error:",
      error
    );


    let message =
      "Google login ব্যর্থ হয়েছে!";


    if (
      error?.code ===
      "auth/popup-closed-by-user"
    ) {

      message =
        "Login window বন্ধ করা হয়েছে।";

    }


    if (
      error?.code ===
      "auth/popup-blocked"
    ) {

      message =
        "Browser popup block করেছে। Popup allow করুন।";

    }


    if (
      error?.code ===
      "auth/unauthorized-domain"
    ) {

      message =
        "Firebase Authentication-এর Authorized Domains-এ এই website/domain যোগ করুন।";

    }


    if (
      error?.code ===
      "auth/operation-not-allowed"
    ) {

      message =
        "Firebase Console-এ Google Sign-in চালু করুন।";

    }


    showToast(
      message
    );

  } finally {

    loginInProgress =
      false;

  }

};


/* =========================================================
   ANONYMOUS LOGIN
========================================================= */

window.loginWithGuest =
async function(e) {

  if (e) {

    e.preventDefault();

  }


  if (loginInProgress) {

    return;

  }


  if (!auth) {

    showToast(
      "Firebase Authentication পাওয়া যায়নি!"
    );

    return;

  }


  const inputElement =
    document.getElementById(
      "quick-login-name"
    );


  const input =
    inputElement
      ? inputElement.value.trim()
      : "";


  if (!input) {

    showToast(
      "আপনার নাম লিখুন!"
    );

    return;

  }


  loginInProgress =
    true;


  try {

    await prepareAuth();


    /*
      যদি current session থাকে,
      নতুন anonymous account বানাবো না।
    */

    if (
      auth.currentUser
    ) {

      firebaseUser =
        auth.currentUser;

      closeLoginModal();

      showToast(
        "আপনি ইতিমধ্যে লগইন আছেন!"
      );

      return;

    }


    /*
      Local device lock শুধু অন্য UID হলে
      নতুন account আটকাবে।
    */

    const localBoundUid =
      localStorage.getItem(
        DEVICE_LOCK_KEY
      );


    if (localBoundUid) {

      showToast(
        "এই ডিভাইসে ইতিমধ্যে একটি account যুক্ত আছে।"
      );

      return;

    }


    /*
      Anonymous sign-in.
    */

    const result =
      await signInAnonymously(
        auth
      );


    const user =
      result.user;


    firebaseUser =
      user;


    const profile = {

      uid:
        user.uid,

      name:
        input,

      email:
        input
          .toLowerCase()
          .replace(
            /\s+/g,
            ""
          ) +
        "@erning.com",

      photoURL:
        "https://api.dicebear.com/7.x/bottts/svg?seed=" +
        encodeURIComponent(
          input
        ),

      coins: 0,

      totalEarned: 0,

      referralCode:
        generateReferralCode(
          user.uid
        ),

      referredBy: "",

      referralCount: 0,

      lastCheckinDate: "",

      isLoggedIn: true,

      status: "active",

      createdAt:
        new Date().toISOString()

    };


    /*
      IMPORTANT:
      Local lock first.
      Firebase binding failure no longer
      cancels authentication.
    */

    lockDeviceToAccount(
      user.uid
    );


    currentUserProfile =
      profile;


    saveLocalProfile(
      profile
    );


    updateDashboardUI(
      profile
    );


    closeLoginModal();


    showToast(
      "সফলভাবে account তৈরি হয়েছে!"
    );


    /*
      Background Firebase sync.
    */

    bindDeviceToAccount(
      user.uid,
      profile
    ).catch(
      console.warn
    );


    syncUserToFirebase(
      profile
    ).catch(
      console.warn
    );


  } catch (error) {

    console.error(
      "Anonymous login error:",
      error
    );


    let message =
      "Login ব্যর্থ হয়েছে।";


    if (
      error?.code ===
      "auth/operation-not-allowed"
    ) {

      message =
        "Firebase Console → Authentication → Sign-in method → Anonymous Enable করুন।";

    }


    if (
      error?.code ===
      "auth/network-request-failed"
    ) {

      message =
        "Internet connection পরীক্ষা করুন।";

    }


    if (
      error?.code ===
      "auth/admin-restricted-operation"
    ) {

      message =
        "Firebase Console-এ Anonymous Authentication চালু করুন।";

    }


    showToast(
      message
    );

  } finally {

    loginInProgress =
      false;

  }

};

========================================================= */

async function saveEarning(
  amount,
  reason
) {

  if (
    !firebaseUser ||
    !db
  ) {

    return null;

  }


  try {

    const earningRef =
      await addDoc(
        collection(
          db,
          "users",
          firebaseUser.uid,
          "earnings"
        ),
        {

          uid:
            firebaseUser.uid,

          amount:
            Number(amount),

          reason:
            reason ||
            "Reward",

          createdAt:
            serverTimestamp(),

          createdAtClient:
            new Date().toISOString()

        }
      );


    if (rtdb) {

      try {

        await set(
          ref(
            rtdb,
            "earnings/" +
            firebaseUser.uid +
            "/" +
            earningRef.id
          ),
          {

            id:
              earningRef.id,

            uid:
              firebaseUser.uid,

            amount:
              Number(amount),

            reason:
              reason ||
              "Reward",

            createdAt:
              Date.now()

          }
        );

      } catch (error) {

        console.warn(
          "RTDB earning save failed:",
          error
        );

      }

    }


    return earningRef.id;

  } catch (error) {

    console.warn(
      "Earning save error:",
      error
    );

    return null;

  }

}

window.handleWithdrawalSubmit =
async function(e) {

  e.preventDefault();


  if (!firebaseUser) {

    showToast(
      "উইথড্র করতে Login করুন!"
    );

    openLoginModal();

    return;

  }


  const methodElement =
    document.querySelector(
      'input[name="pay_method"]:checked'
    );


  if (!methodElement) {

    showToast(
      "Payment method নির্বাচন করুন!"
    );

    return;

  }


  const method =
    methodElement.value;


  const accountElement =
    document.getElementById(
      "withdraw-account-no"
    );


  const amountElement =
    document.getElementById(
      "withdraw-coin-amount"
    );


  const accountNo =
    accountElement
      ? accountElement.value.trim()
      : "";


  const coinAmount =
    Number(
      amountElement
        ? amountElement.value
        : 0
    ) || 0;


  const minCoinsMap = {

    Recharge: 2000,

    bKash: 5000,

    Nagad: 5000,

    Rocket: 5000,

    Crypto: 50000,

    Payoneer: 50000

  };


  const minRequired =
    minCoinsMap[method] ||
    5000;


  if (
    coinAmount <
    minRequired
  ) {

    showToast(
      `সর্বনিম্ন ${minRequired.toLocaleString()} কয়েন প্রয়োজন!`
    );

    return;

  }


  if (
    coinAmount >
    Number(
      currentUserProfile.coins || 0
    )
  ) {

    showToast(
      "আপনার পর্যাপ্ত balance নেই!"
    );

    return;

  }


  const bdtAmount =
    (
      coinAmount / 100
    ).toFixed(2);


  const withdrawalId =
    "WD" +
    Date.now();


  const withdrawalData = {

    id:
      withdrawalId,

    uid:
      firebaseUser.uid,

    method:
      method,

    accountNo:
      accountNo,

    coins:
      coinAmount,

    bdtAmount:
      bdtAmount,

    status:
      "pending",

    createdAtClient:
      new Date().toISOString()

  };


  try {

    if (db) {

      await setDoc(
        doc(
          db,
          "withdrawals",
          withdrawalId
        ),
        {

          ...withdrawalData,

          createdAt:
            serverTimestamp()

        }
      );


      const txRef =
        await addDoc(
          collection(
            db,
            "users",
            firebaseUser.uid,
            "transactions"
          ),
          {

            uid:
              firebaseUser.uid,

            withdrawalId:
              withdrawalId,

            type:
              "withdrawal",

            method:
              method,

            accountNo:
              accountNo,

            coins:
              coinAmount,

            bdtAmount:
              bdtAmount,

            status:
              "pending",

            createdAt:
              serverTimestamp(),

            createdAtClient:
              new Date().toISOString()

          }
        );


      if (rtdb) {

        try {

          await set(
            ref(
              rtdb,
              "withdrawals/" +
              firebaseUser.uid +
              "/" +
              withdrawalId
            ),
            {

              ...withdrawalData,

              createdAt:
                Date.now()

            }
          );


          await set(
            ref(
              rtdb,
              "transactions/" +
              firebaseUser.uid +
              "/" +
              txRef.id
            ),
            {

              id:
                txRef.id,

              uid:
                firebaseUser.uid,

              type:
                "withdrawal",

              withdrawalId:
                withdrawalId,

              method:
                method,

              accountNo:
                accountNo,

              coins:
                coinAmount,

              bdtAmount:
                bdtAmount,

              status:
                "pending",

              createdAt:
                Date.now()

            }
          );

        } catch (error) {

          console.warn(
            "RTDB withdrawal sync failed:",
            error
          );

        }

      }

    }


    /*
      Balance reduce
    */

    currentUserProfile.coins =
      Number(
        currentUserProfile.coins || 0
      ) -
      coinAmount;


    saveLocalProfile(
      currentUserProfile
    );


    await syncUserToFirebase(
      currentUserProfile
    );


    await loadTransactionHistory();


    const form =
      document.getElementById(
        "withdraw-form"
      );


    if (form) {

      form.reset();

    }


    showToast(
      "উইথড্র রিকোয়েস্ট সফলভাবে জমা হয়েছে!"
    );


  } catch (error) {

    console.error(
      "Withdrawal error:",
      error
    );


    showToast(
      "Withdrawal save হয়নি। Firebase Rules পরীক্ষা করুন।"
    );

  }

};


/* =========================================================
   TRANSACTION HISTORY
========================================================= */

async function loadTransactionHistory() {

  const container =
    document.getElementById(
      "transaction-history-list"
    );


  if (!container) return;


  if (
    !firebaseUser ||
    !db
  ) {

    container.innerHTML =
      `
      <div class="text-center py-6 text-slate-500 text-xs">
        Login করলে transaction history দেখা যাবে
      </div>
      `;

    return;

  }


  try {

    const q =
      query(
        collection(
          db,
          "users",
          firebaseUser.uid,
          "transactions"
        ),
        orderBy(
          "createdAtClient",
          "desc"
        ),
        limit(50)
      );


    const snapshot =
      await getDocs(q);


    if (
      snapshot.empty
    ) {

      container.innerHTML =
        `
        <div class="text-center py-6 text-slate-500 text-xs">
          কোনো transaction নেই
        </div>
        `;

      return;

    }


    const list =
      snapshot.docs.map(
        docSnap => ({

          id:
            docSnap.id,

          ...docSnap.data()

        })
      );


    container.innerHTML =
      list.map(
        item => `

        <div
          class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 flex items-center justify-between text-xs"
        >

          <div>

            <div class="font-bold text-white">
              ${escapeHTML(
                item.method ||
                "Transaction"
              )}
            </div>

            <div class="text-[10px] text-slate-400">
              ${
                item.accountNo
                  ? escapeHTML(
                      item.accountNo
                    )
                  : ""
              }
            </div>

          </div>

          <div class="text-right">

            <div class="font-bold text-amber-300">
              ${
                Number(
                  item.coins || 0
                ).toLocaleString()
              }
              কয়েন
            </div>

            <span
              class="inline-block text-[10px] px-2 py-0.5 rounded-full border bg-amber-500/20 text-amber-400 border-amber-500/30"
            >
              ${escapeHTML(
                item.status ||
                "pending"
              )}
            </span>

          </div>

        </div>

        `
      ).join("");


  } catch (error) {

    console.warn(
      "Transaction load error:",
      error
    );


    container.innerHTML =
      `
      <div class="text-center py-6 text-red-400 text-xs">
        Transaction load করা যায়নি।
      </div>
      `;

  }

}

/* =========================================================

========================================================= */

window.copyReferralLink =
function() {

  const codeElement =
    document.getElementById(
      "user-ref-code-display"
    );


  const code =
    codeElement
      ? codeElement.innerText
      : "";


  const link =
    `${window.location.origin}/?ref=${code}`;


  if (
    navigator.clipboard
  ) {

    navigator.clipboard
      .writeText(
        link
      )
      .then(
        () => {

          showToast(
            "Referral link copy হয়েছে!"
          );

        }
      )
      .catch(
        () => {

          fallbackCopy(
            link
          );

        }
      );

  } else {

    fallbackCopy(
      link
    );

  }

};


function fallbackCopy(text) {

  const input =
    document.createElement(
      "input"
    );


  input.value =
    text;


  document.body.appendChild(
    input
  );


  input.select();

      "copy"
    );

  } catch (e) {}


  input.remove();


  showToast(
    "Referral link copy হয়েছে!"
  );

}

/* =========================================================

========================================================= */

window.switchTab =
function(
  tabId,
  gameTarget
) {

  document
    .querySelectorAll(
      ".tab-content"
    )
    .forEach(
      el =>
        el.classList.add(
          "hidden"
        )
    );


  const target =
    document.getElementById(
      tabId
    );


  if (target) {

    target.classList.remove(
      "hidden"
    );

  }


  document
    .querySelectorAll(
      ".nav-tab-item"
    )
    .forEach(
      el => {

        el.classList.remove(
          "text-brand-500"
        );

        el.classList.add(
          "text-slate-400"
        );

      }
    );


  const nav =
    document.getElementById(
      "nav-btn-" +
      tabId.replace(
        "tab-",
        ""
      )
    );


  if (nav) {

    nav.classList.add(
      "text-brand-500"
    );

    nav.classList.remove(
      "text-slate-400"
    );

  }


  if (gameTarget) {

    const game =
      document.getElementById(
        "task-" +
        gameTarget +
        "-card"
      );


    if (game) {

      setTimeout(
        () => {

          game.scrollIntoView({
            behavior:
              "smooth"
          });

        },
        100
      );

    }

  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

};

/* =========================================================
   SOUND
========================================================= */

function playWinSound() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {

      return;

    }


    const ctx =
      new AudioContext();


    const osc =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    osc.connect(
      gain
    );


    gain.connect(
      ctx.destination
    );


    osc.type =
      "triangle";


    osc.frequency.setValueAtTime(
      440,
      ctx.currentTime
    );


    osc.frequency.exponentialRampToValueAtTime(
      880,
      ctx.currentTime + 0.3
    );


    gain.gain.setValueAtTime(
      0.15,
      ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.01,
      ctx.currentTime + 0.3
    );


    osc.start();


    osc.stop(
      ctx.currentTime + 0.3
    );

  } catch (error) {}

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
