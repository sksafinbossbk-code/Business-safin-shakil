/* =========================================================
   RANDOM ID
========================================================= */

function generateRandomId(length = 40) {

  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  let result = "";

  for (let i = 0; i < length; i++) {

    result += chars.charAt(
      Math.floor(
        Math.random() * chars.length
      )
    );

  }

  return result;

}


/* =========================================================

========================================================= */

    if (!id) {

      id =
        generateRandomId(40);

      localStorage.setItem(
        DEVICE_ID_KEY,
        id
      );

    }

    return id;

  } catch (error) {

    console.warn(
      "Device ID error:",
      error

    return generateRandomId(40);

  }

}

/* =========================================================
   DEVICE LOCAL LOCK
========================================================= */

function getLocalBoundUid() {

  try {

    return localStorage.getItem(
      DEVICE_LOCK_KEY
    ) || "";

  } catch (error) {

    return "";

  }

}


function isDeviceLockedToOtherAccount(uid) {

  const boundUid =
    getLocalBoundUid();

  return (
    !!boundUid &&
    boundUid !== uid
  );

}


function lockDeviceToAccount(uid) {

  if (!uid) return false;

  try {

    const existing =
      getLocalBoundUid();

    if (!existing) {

      localStorage.setItem(
        DEVICE_LOCK_KEY,
        uid
      );

      return true;

    }

    return existing === uid;

  } catch (error) {

    console.warn(
      "Device local lock error:",
      error
    );

    return true;

  }

}

async function getFirestoreDeviceBinding() {

/* =========================================================

========================================================= */

    const deviceRef =
      ref(

/* =========================================================
   CHECK DEVICE BINDING
========================================================= */

async function checkDeviceBinding(uid) {

  if (!uid) {

    return {
      allowed: false,
      reason: "INVALID_UID"
    };

  }


  /*
    Local check
  */

  if (
    isDeviceLockedToOtherAccount(uid)
  ) {

    return {

      allowed: false,

      reason:
        "LOCAL_OTHER_ACCOUNT"

    };

  }


  /*
    Server checks
  */

  let firestoreBinding = null;
  let realtimeBinding = null;


  try {

    firestoreBinding =
      await getFirestoreDeviceBinding();

  } catch (error) {

    console.warn(
      error
    );

  }


  try {

    realtimeBinding =
      await getRealtimeDeviceBinding();

  } catch (error) {

    console.warn(
      error
    );

  }


  const firestoreUid =
    firestoreBinding?.uid || "";

  const realtimeUid =
    realtimeBinding?.uid || "";


  if (
    firestoreUid &&
    firestoreUid !== uid
  ) {

    return {

      allowed: false,

      reason:
        "FIRESTORE_OTHER_ACCOUNT",

      boundUid:
        firestoreUid

    };

  }


  if (
    realtimeUid &&
    realtimeUid !== uid
  ) {

    return {

      allowed: false,

      reason:
        "RTDB_OTHER_ACCOUNT",

      boundUid:
        realtimeUid

    };

  }


  return {

    allowed: true,

    reason: "OK"

  };

}


/* =========================================================
   BIND DEVICE
========================================================= */

async function bindDeviceToAccount(
  uid,
  profile
) {

  if (
    !uid ||
    !deviceInstallationId
  ) {

    return false;

  }


  /*
    Local binding first.
  */

  const localBound =
    getLocalBoundUid();


  if (
    localBound &&
    localBound !== uid
  ) {

    return false;

  }


  const bindingData = {

    deviceId:
      deviceInstallationId,

    uid:
      uid,

    name:
      profile?.name ||
      "ব্যবহারকারী",

    createdAtClient:
      new Date().toISOString(),

    updatedAt:
      Date.now(),

    active:
      true

  };


  /*
    IMPORTANT:
    Database binding failure should NOT
    automatically destroy a successful
    Firebase Auth session.

    This was one of the main login problems.
  */


  let firestoreSuccess = false;
  let rtdbSuccess = false;


  /* -------------------------------------------------------
     FIRESTORE
  ------------------------------------------------------- */

  if (db) {

    try {

      const deviceRef =
        doc(
          db,
          "deviceBindings",
          deviceInstallationId
        );


      const existing =
        await getDoc(
          deviceRef
        );


      if (
        existing.exists()
      ) {

        const existingUid =
          existing.data()?.uid || "";


        if (
          existingUid &&
          existingUid !== uid
        ) {

          return false;

        }

      }


      await setDoc(
        deviceRef,
        bindingData,
        {
          merge: true
        }
      );


      firestoreSuccess = true;

    } catch (error) {

      console.warn(
        "Firestore device binding write failed:",
        error
      );

    }

  }


  /* -------------------------------------------------------
     RTDB
  ------------------------------------------------------- */

  if (rtdb) {

    try {

      const deviceRef =
        ref(
          rtdb,
          "deviceBindings/" +
          deviceInstallationId
        );


      const existing =
        await get(
          deviceRef
        );


      if (
        existing.exists()
      ) {

        const existingUid =
          existing.val()?.uid || "";


        if (
          existingUid &&
          existingUid !== uid
        ) {

          return false;

        }

      }


      await set(
        deviceRef,
        bindingData
      );


      rtdbSuccess = true;

    } catch (error) {

      console.warn(
        "RTDB device binding write failed:",
        error
      );

    }

  }


  /*
    Local lock is always maintained
    after Firebase authentication.
  */

  const localLocked =
    lockDeviceToAccount(uid);


  /*
    Login should not fail merely because
    one database rule is not configured.
  */

  if (
    localLocked
  ) {

    if (
      firestoreSuccess ||
      rtdbSuccess ||
      !db && !rtdb
    ) {

      console.log(
        "Device bound:",
        {
          firestoreSuccess,
          rtdbSuccess
        }
      );

    }


    return true;

  }


  return false;

}

/* =========================================================

========================================================= */

) {

    profile

  const results =
    await Promise.allSettled([

      saveUserToFirestore(
        profile
      ),

      saveUserToRealtimeDB(
        profile
      )

    ]);


  console.log(
    "Firebase sync:",
    results
  );

}

/* =========================================================
   MERGE USER DATA
========================================================= */

function mergeUserData(
  localData,
  firestoreData,
  rtdbData,
  firebaseUserData
) {

  const sources = [

    localData || {},

    firestoreData || {},

    rtdbData || {},

    firebaseUserData || {}

  ];


  const merged = {};


  for (
    const source of sources
  ) {

    Object.keys(source)
      .forEach(key => {

        if (
          source[key] !== undefined &&
          source[key] !== null
        ) {

          merged[key] =
            source[key];

        }

      });

  }


  merged.uid =
    firebaseUserData?.uid ||
    firestoreData?.uid ||
    rtdbData?.uid ||
    localData?.uid ||
    "";


  merged.coins =
    Number(
      firestoreData?.coins ??
      rtdbData?.coins ??
      localData?.coins ??
      0
    );


  merged.totalEarned =
    Number(
      firestoreData?.totalEarned ??
      rtdbData?.totalEarned ??
      localData?.totalEarned ??
      0
    );


  merged.referralCount =
    Number(
      firestoreData?.referralCount ??
      rtdbData?.referralCount ??
      localData?.referralCount ??
      0
    );


  merged.isLoggedIn =
    true;


  merged.status =
    merged.status ||
    "active";


  return merged;

}


/* =========================================================
   GENERATE REFERRAL CODE
========================================================= */

function generateReferralCode(uid) {

  if (!uid) {

    return (
      "EARN" +
      Math.random()
        .toString(36)
        .substring(2, 8)
        .toUpperCase()
    );

  }


  return (
    "EARN" +
    uid
      .replace(
        /[^A-Za-z0-9]/g,
        ""
      )
      .substring(0, 8)
      .toUpperCase()
  );

}


/* =========================================================
   LOAD / CREATE USER
========================================================= */

async function loadOrCreateFirebaseProfile(
  user
) {

  if (!user) return;


  firebaseUser =
    user;


  console.log(
    "Authenticated UID:",
    user.uid
  );


  /*
    Local account check.
  */

  const localBoundUid =
    getLocalBoundUid();


  if (
    localBoundUid &&
    localBoundUid !== user.uid
  ) {

    console.warn(
      "Another account is bound locally."
    );


    /*
      Only reject a genuinely different
      Firebase account.
    */

    try {

      await signOut(
        auth
      );

    } catch (error) {}


    showToast(
      "এই ডিভাইসে অন্য account আগে থেকেই যুক্ত আছে!"
    );

    return;

  }


  /*
    Server binding check.
  */

  const deviceCheck =
    await checkDeviceBinding(
      user.uid
    );


  if (
    !deviceCheck.allowed
  ) {

    console.warn(
      "Device binding rejected:",
      deviceCheck
    );


    try {

      await signOut(
        auth
      );

    } catch (error) {}


    showToast(
      "এই ডিভাইসে অন্য account যুক্ত আছে!"
    );

    return;

  }


  /*
    Load existing data.
  */

  const local =
    getLocalProfile();


  const firestore =
    await loadUserFromFirestore(
      user.uid
    );


  const realtime =
    await loadUserFromRealtimeDB(
      user.uid
    );


  const firebaseBasicData = {

    uid:
      user.uid,

    name:
      user.displayName ||
      firestore?.name ||
      realtime?.name ||
      local.name ||
      "ব্যবহারকারী",

    email:
      user.email ||
      firestore?.email ||
      realtime?.email ||
      local.email ||
      "",

    photoURL:
      user.photoURL ||
      firestore?.photoURL ||
      realtime?.photoURL ||
      local.photoURL ||
      (
        "https://api.dicebear.com/7.x/bottts/svg?seed=" +
        encodeURIComponent(
          user.uid
        )
      )

  };


  currentUserProfile =
    mergeUserData(
      local,
      firestore,
      realtime,
      firebaseBasicData
    );


  /*
    Anonymous login-এর নাম যেন
    local profile থেকে থাকে।
  */

  if (
    user.isAnonymous &&
    local.uid === user.uid &&
    local.name
  ) {

    currentUserProfile.name =
      local.name;

  }


  if (
    !currentUserProfile.referralCode
  ) {

    currentUserProfile.referralCode =
      generateReferralCode(
        user.uid
      );

  }


  if (
    !currentUserProfile.createdAt
  ) {

    currentUserProfile.createdAt =
      new Date().toISOString();

  }


  currentUserProfile.isLoggedIn =
    true;


  /*
    Device binding.
    এখানে database permission failure
    login বন্ধ করবে না।
  */

  const bound =
    await bindDeviceToAccount(
      user.uid,
      currentUserProfile
    );


  if (!bound) {

    /*
      শুধু অন্য account-এর local lock হলে
      sign out করা হবে।
    */

    const currentBound =
      getLocalBoundUid();


    if (
      currentBound &&
      currentBound !== user.uid
    ) {

      try {

        await signOut(
          auth
        );

      } catch (error) {}


      currentUserProfile.isLoggedIn =
        false;


      saveLocalProfile(
        currentUserProfile
      );


      updateDashboardUI(
        currentUserProfile
      );


      showToast(
        "এই ডিভাইসে অন্য account যুক্ত আছে!"
      );


      return;

    }


    /*
      Otherwise login remains active.
    */

    console.warn(
      "Device binding server write unavailable; login kept active."
    );

  }


  saveLocalProfile(
    currentUserProfile
  );


  /*
    Database sync failure will not
    log the user out.
  */

  await syncUserToFirebase(
    currentUserProfile
  );


  updateDashboardUI(
    currentUserProfile
  );


  closeLoginModal();


  await loadTransactionHistory();


  console.log(
    "User profile loaded successfully:",
    currentUserProfile
  );

}


/* =========================================================
   AUTH STATE LISTENER
========================================================= */

function startAuthListener() {

  if (!auth) return;


  onAuthStateChanged(
    auth,
    async user => {

      console.log(
        "Auth state:",
        user
          ? user.uid
          : "SIGNED OUT"
      );


      if (user) {

        try {

          await loadOrCreateFirebaseProfile(
            user
          );

        } catch (error) {

          console.error(
            "Auth profile error:",
            error
          );


          /*
            Firebase authentication itself
            should remain active.
          */

          firebaseUser =
            user;


          currentUserProfile =
            getLocalProfile();


          currentUserProfile.uid =
            user.uid;


          currentUserProfile.isLoggedIn =
            true;


          currentUserProfile.name =
            user.displayName ||
            currentUserProfile.name ||
            "ব্যবহারকারী";


          currentUserProfile.email =
            user.email ||
            currentUserProfile.email ||
            "";


          currentUserProfile.photoURL =
            user.photoURL ||
            currentUserProfile.photoURL;


          saveLocalProfile(
            currentUserProfile
          );


          updateDashboardUI(
            currentUserProfile
          );


          closeLoginModal();


          showToast(
            "Login হয়েছে, তবে database sync পরে হবে।"
          );

        }

      } else {

        firebaseUser =
          null;


        currentUserProfile =
          getLocalProfile();


        currentUserProfile.isLoggedIn =
          false;


        saveLocalProfile(
          currentUserProfile
        );


        updateDashboardUI(
          currentUserProfile
        );


        await loadTransactionHistory();

      }

    }
  );

}

window.handleGoogleLogin =
async function() {

  if (!firebaseReady || !auth) {

    showToast(
      "Firebase এখনো প্রস্তুত নয়। একটু পরে চেষ্টা করুন।"
    );

    return;

  }


  /*
    Existing local binding.
    Same account হলে login করা যাবে।
    অন্য account হলে block।
  */

  const localBoundUid =
    getLocalBoundUid();


  if (
    localBoundUid &&
    auth.currentUser &&
    auth.currentUser.uid ===
    localBoundUid
  ) {

    showToast(
      "এই account ইতিমধ্যে লগইন আছে!"
    );

    closeLoginModal();

    return;

  }


  if (
    localBoundUid &&
    !auth.currentUser
  ) {

    showToast(
      "এই ডিভাইসে আগে থেকেই একটি account যুক্ত আছে।"
    );

    return;

  }


  if (
    localBoundUid
  ) {

    showToast(
      "এই ডিভাইসে অন্য account খোলা যাবে না!"
    );

    return;

  }


  try {

    const provider =
      new GoogleAuthProvider();


    provider.setCustomParameters({

      prompt:
        "select_account"

    });


    showToast(
      "Google login খোলা হচ্ছে..."
    );


    const result =
      await signInWithPopup(
        auth,
        provider
      );


    const user =
      result.user;


    console.log(
      "Google login success:",
      user.uid
    );


    /*
      Auth success.
      Profile loader এখন বাকি কাজ করবে।
    */

    closeLoginModal();


    showToast(
      "Google login সফল হয়েছে!"
    );


  } catch (error) {

    console.error(
      "Google login error:",
      error
    );


    if (
      error.code ===
      "auth/popup-blocked"
    ) {

      showToast(
        "Browser popup block করেছে। Popup allow করুন।"
      );

    } else if (
      error.code ===
      "auth/popup-closed-by-user"
    ) {

      showToast(
        "Google login window বন্ধ করা হয়েছে।"
      );

    } else if (
      error.code ===
      "auth/unauthorized-domain"
    ) {

      showToast(
        "Firebase Console-এর Authorized Domains-এ এই website যোগ করুন।"
      );

    } else if (
      error.code ===
      "auth/operation-not-allowed"
    ) {

      showToast(
        "Firebase Authentication-এ Google Sign-in চালু করুন।"
      );

    } else {

      showToast(
        "Google login ব্যর্থ: " +
        (
          error.message ||
          "Unknown error"
        )
      );

    }

  }

};


/* =========================================================
   ANONYMOUS / GUEST LOGIN
========================================================= */

window.loginWithGuest =
async function(e) {

  if (e) {

    e.preventDefault();

  }


  if (!firebaseReady || !auth) {

    showToast(
      "Firebase এখনো প্রস্তুত নয়।"
    );

    return;

  }


  /*
    Already logged in?
  */

  if (
    auth.currentUser
  ) {

    showToast(
      "আপনি ইতিমধ্যে লগইন আছেন!"
    );

    closeLoginModal();

    return;

  }


  /*
    Device already bound?
  */

  const localBoundUid =
    getLocalBoundUid();


  if (
    localBoundUid
  ) {

    showToast(
      "এই ডিভাইসে ইতিমধ্যে একটি account যুক্ত আছে!"
    );

    return;

  }


  const inputEl =
    document.getElementById(
      "quick-login-name"
    );


  const input =
    inputEl
      ? inputEl.value.trim()
      : "";


  if (!input) {

    showToast(
      "আপনার নাম লিখুন!"
    );

    return;

  }


  if (
    input.length < 2
  ) {

    showToast(
      "কমপক্ষে ২ অক্ষরের নাম দিন।"
    );

    return;

  }


  try {

    showToast(
      "Account তৈরি হচ্ছে..."
    );


    const result =
      await signInAnonymously(
        auth
      );


    const user =
      result.user;


    console.log(
      "Anonymous login success:",
      user.uid
    );


    const profile = {

      uid:
        user.uid,

      name:
        input,

      email:
        input
          .toLowerCase()
          .replace(
            /\s+/g,
            ""
          )
          .replace(
            /[^a-z0-9]/g,
            ""
          ) +
        "@erning.com",

      photoURL:
        "https://api.dicebear.com/7.x/bottts/svg?seed=" +
        encodeURIComponent(
          input
        ),

      coins: 0,

      totalEarned: 0,

      referralCode:
        generateReferralCode(
          user.uid
        ),

      referredBy: "",

      referralCount: 0,

      lastCheckinDate: "",

      isLoggedIn: true,

      status: "active",

      createdAt:
        new Date().toISOString()

    };


    /*
      Local lock first.
    */

    if (
      !lockDeviceToAccount(
        user.uid
      )
    ) {

      await signOut(
        auth
      );


      showToast(
        "এই ডিভাইসে অন্য account যুক্ত আছে!"
      );

      return;

    }


    currentUserProfile =
      profile;


    firebaseUser =
      user;


    saveLocalProfile(
      currentUserProfile
    );


    /*
      Database sync should NOT
      destroy login.
    */

    await syncUserToFirebase(
      currentUserProfile
    );


    closeLoginModal();


    updateDashboardUI(
      currentUserProfile
    );


    showToast(
      "সফলভাবে account তৈরি হয়েছে!"
    );


    await loadTransactionHistory();


  } catch (error) {

    console.error(
      "Anonymous login error:",
      error
    );


    if (
      error.code ===
      "auth/operation-not-allowed"
    ) {

      showToast(
        "Firebase Console → Authentication → Anonymous Sign-in চালু করুন।"
      );

    } else if (
      error.code ===
      "auth/network-request-failed"
    ) {

      showToast(
        "Internet connection পরীক্ষা করুন।"
      );

    } else {

      showToast(
        "Login ব্যর্থ: " +
        (
          error.message ||
          "Unknown error"
        )
      );

    }

  }

};


/* =========================================================
   ADD EARNING
========================================================= */

async function saveEarning(
  amount,
  reason
) {

  if (
    !firebaseUser ||
    !db
  ) {

    return null;

  }


  try {

    const earningRef =
      await addDoc(
        collection(
          db,
          "users",
          firebaseUser.uid,
          "earnings"
        ),
        {

          uid:
            firebaseUser.uid,

          amount:
            Number(amount),

          reason:
            reason ||
            "Reward",

          createdAt:
            serverTimestamp(),

          createdAtClient:
            new Date().toISOString()

        }
      );


    if (rtdb) {

      try {

        const rtdbEarningRef =
          ref(
            rtdb,
            "earnings/" +
            firebaseUser.uid +
            "/" +
            earningRef.id
          );


        await set(
          rtdbEarningRef,
          {

            id:
              earningRef.id,

            uid:
              firebaseUser.uid,

            amount:
              Number(amount),

            reason:
              reason ||
              "Reward",

            createdAt:
              Date.now()

          }
        );

      } catch (error) {

        console.warn(
          "RTDB earning save failed:",
          error
        );

      }

    }


    return earningRef.id;

  } catch (error) {

    console.warn(
      "Earning save error:",
      error
    );

    return null;

  }

}

            withdrawalId,

            "withdrawal",

            accountNo,

          coins:

            bdtAmount,

          status:
            "pending",

          createdAt:
            serverTimestamp(),

          createdAtClient:
            new Date().toISOString()

      );

        await set(
          ref(
            rtdb,
            "withdrawals/" +
            firebaseUser.uid +
            "/" +
            withdrawalId
          ),
          {

            ...withdrawalData,

            createdAt:
              Date.now()

          }
        );

          ),

/* =========================================================
   TRANSACTION HISTORY
========================================================= */

async function loadTransactionHistory() {

  const container =
    document.getElementById(
      "transaction-history-list"
    );


  if (!container) return;


  if (
    !firebaseUser ||
    !db
  ) {

    container.innerHTML = `
      <div class="text-center py-6 text-slate-500 text-xs">
        Login করলে transaction history দেখা যাবে
      </div>
    `;

    return;

  }


  try {

    const q =
      query(
        collection(
          db,
          "users",
          firebaseUser.uid,
          "transactions"
        ),
        orderBy(
          "createdAtClient",
          "desc"
        ),
        limit(50)
      );


    const snapshot =
      await getDocs(q);


    if (
      snapshot.empty
    ) {

      container.innerHTML = `
        <div class="text-center py-6 text-slate-500 text-xs">
          কোনো transaction নেই
        </div>
      `;

      return;

    }


    const list =
      snapshot.docs.map(
        docSnap => ({

          id:
            docSnap.id,

          ...docSnap.data()

        })
      );


    container.innerHTML =
      list.map(
        item => `

        <div
          class="bg-slate-900/80 p-3 rounded-xl border border-slate-800 flex items-center justify-between text-xs"
        >

          <div>

            <div class="font-bold text-white">

              ${escapeHTML(
                item.method ||
                "Transaction"
              )}

            </div>

            <div class="text-[10px] text-slate-400">

              ${
                item.accountNo
                  ? escapeHTML(
                      item.accountNo
                    )
                  : ""
              }

            </div>

          </div>

          <div class="text-right">

            <div class="font-bold text-amber-300">

              ${Number(
                item.coins || 0

      input.select();


      document.execCommand(
        "copy"
      );


      input.remove();


      showToast(
        "Referral link copy হয়েছে!"
      );

    });

};

window.switchTab =
function(
  tabId,
  gameTarget
) {

  document
    .querySelectorAll(
      ".tab-content"
    )
    .forEach(
      el =>
        el.classList.add(
          "hidden"
        )
    );


  const target =
    document.getElementById(
      tabId
    );


  if (target) {

    target.classList.remove(
      "hidden"
    );

  }


  document
    .querySelectorAll(
      ".nav-tab-item"
    )
    .forEach(
      el => {

        el.classList.remove(
          "text-brand-500"
        );

        el.classList.add(
          "text-slate-400"
        );

      }
    );


  const nav =
    document.getElementById(
      "nav-btn-" +
      tabId.replace(
        "tab-",
        ""
      )
    );


  if (nav) {

    nav.classList.add(
      "text-brand-500"
    );

    nav.classList.remove(
      "text-slate-400"
    );

  }


  if (gameTarget) {

    const game =
      document.getElementById(
        "task-" +
        gameTarget +
        "-card"
      );


    if (game) {

      setTimeout(() => {

        game.scrollIntoView({
          behavior:
            "smooth"
        });

      }, 100);

    }

  }


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

};

function playWinSound() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) return;


    const ctx =
      new AudioContext();


    const osc =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    osc.connect(
      gain
    );


    gain.connect(
      ctx.destination
    );


    osc.type =
      "triangle";


    osc.frequency.setValueAtTime(
      440,
      ctx.currentTime
    );


    osc.frequency.exponentialRampToValueAtTime(
      880,
      ctx.currentTime + 0.3
    );


    gain.gain.setValueAtTime(
      0.15,
      ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.01,
      ctx.currentTime + 0.3
    );


    osc.start();


    osc.stop(
      ctx.currentTime + 0.3
    );

  } catch (error) {}

}

function escapeHTML(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
